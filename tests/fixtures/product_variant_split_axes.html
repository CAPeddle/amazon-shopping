<!doctype html>
<!--
  Two axes that only different selectors reach: the size list carries
  data-asin, the colour list carries only data-dp-url. Stopping at the first
  matching selector would lose the colours entirely.
-->
<html lang="nl"><body>
<div id="nav-belt">
  <a id="nav-link-accountList" href="/gp/css/homepage.html"><span id="nav-link-accountList-nav-line-1">Hallo, Chris</span></a>
  <span id="nav-cart-count">1</span>
</div>
<div id="dp">
  <input type="hidden" id="ASIN" value="B0SPLITAX1">
  <span id="productTitle">Wandelschoenen</span>
  <div id="twister_feature_div">
    <div id="variation_size_name"><ul>
      <li data-asin="B0SIZE0042"><span>Maat 42</span></li>
    </ul></div>
  </div>
  <div id="variation_color_name"><ul>
    <li data-dp-url="/dp/B0COLBRWN1"><span>Bruin</span></li>
    <li data-dp-url="/dp/B0COLGREY1"><span>Grijs</span></li>
  </ul></div>
</div>
</body></html>
