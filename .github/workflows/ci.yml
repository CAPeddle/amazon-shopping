name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every test runs against saved fixtures; nothing here reaches amazon.nl.
  AMAZON_MCP_AUTH_TOKEN: ci-token-0123456789abcdef
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          # The build is pinned to the Playwright version, so the lockfile is the key.
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -q --cov=amazon_nl_mcp --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          uv run amazon-nl-mcp --help
          uv run amazon-nl-mcp token > /dev/null
