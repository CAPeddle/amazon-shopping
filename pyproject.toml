[project]
name = "amazon-nl-mcp"
version = "0.1.0"
description = "MCP server for searching amazon.nl and managing a personal Amazon cart via a logged-in browser session"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.1.1,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "playwright>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
amazon-nl-mcp = "amazon_nl_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_nl_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PTH", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# anyio's plugin, not pytest-asyncio: pytest-asyncio 1.4 runs async-generator
# fixture setup and teardown in different tasks, which breaks any fixture that
# yields from an anyio context manager -- mcp's Client among them -- and needs
# both loop-scope options set before a session-scoped browser even works.
anyio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real amazon.nl with the real browser profile (deselected by default)",
]
addopts = "-m 'not live'"
